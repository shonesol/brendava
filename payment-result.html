<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Brendava Payment Status</title><style>body{font-family:Arial,sans-serif;background:#f7faf9;color:#1f2937;margin:0;display:grid;min-height:100vh;place-items:center}.card{background:#fff;padding:32px;border-radius:18px;max-width:560px;width:calc(100% - 40px);box-shadow:0 12px 40px #0f172a12;text-align:center}h1{color:#123a73}#status{font-size:1.05rem;line-height:1.6}.small{color:#64748b;font-size:.9rem}a{color:#0b7a41;font-weight:bold}</style></head><body><main class="card"><h1>Brendava Tours &amp; Travel</h1><h2>Payment verification</h2><p id="status">Checking your payment securely with DPO. Please wait…</p><p class="small">Do not close this page while your payment is being checked.</p><p><a href="https://www.brendavatoursandtravel.com/">Return to Brendava website</a></p></main><script>
(async()=>{const el=document.getElementById('status');const q=new URLSearchParams(location.search);const token=q.get('TransactionToken')||q.get('transToken');const ref=q.get('CompanyRef');if(!token||!ref){el.textContent='We could not identify the payment reference. Please contact Brendava and provide your booking reference.';return;}try{const api='https://brendava-global-ai.shonesol28.workers.dev/api/dpo/verify?'+new URLSearchParams({TransactionToken:token,CompanyRef:ref});const r=await fetch(api,{headers:{Accept:'application/json'},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Verification unavailable');if(d.status==='PAID'){el.innerHTML='Your payment has been successfully verified.<br><strong>Booking reference: '+String(d.reference).replace(/[&<>"']/g,'')+'</strong><br>Amount received: '+Number(d.amount).toLocaleString('en-US',{style:'currency',currency:d.currency||'USD'})+'<br>Brendava will follow up with your booking details.';}else if(d.status==='REVIEW'){el.textContent='Your payment was received by DPO but requires manual review. Please contact Brendava with reference '+ref+'.';}else if(d.status==='PENDING'){el.textContent='Your payment is still pending with DPO. Please wait a little and contact Brendava if the status does not update. Reference: '+ref;}else{el.textContent='The payment was not completed. Status: '+d.status+'. You can return to Brendava and try again, or contact our team. Reference: '+ref;}}catch(e){console.error(e);el.textContent='We could not verify the payment right now. This does not mean it failed. Please contact Brendava with reference '+ref+' before trying again.';}})();
</script></body></html>
