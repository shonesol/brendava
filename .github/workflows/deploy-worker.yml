name: Deploy Global AI worker
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(printf '%s' "$RAW_TOKEN" | grep -oE 'cf[a-z]{2}_[A-Za-z0-9_-]+' | head -n1 || true)
          if [ -z "$T" ]; then T=$(printf '%s' "$RAW_TOKEN" | head -n1 | tr -d '[:space:]'); fi
          A=$(printf '%s' "$RAW_ACCOUNT" | grep -oE '[0-9a-f]{32}' | head -n1 || true)
          echo "Token length: ${#T}  starts with: ${T:0:5}  Account ID length: ${#A}"
          echo "::add-mask::$T"
          echo "::add-mask::$A"
          echo "CF_TOKEN=$T" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT=$A" >> "$GITHUB_ENV"
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          workingDirectory: worker


