<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Updates | Brendava Tours</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background:#f4f7f5; color:#222; min-height:100vh; }
    .container { max-width:960px; margin:0 auto; padding:30px 20px; }
    header { text-align:center; margin-bottom:40px; }
    header h1 { color:#0B7A41; font-size:32px; margin-bottom:8px; }
    header p { color:#666; }
    .news-grid { display:grid; gap:28px; }
    .news-card {
      background:#fff; border-radius:18px; overflow:hidden;
      box-shadow:0 12px 30px rgba(0,0,0,.07); transition:.3s;
    }
    .news-card:hover { transform:translateY(-4px); box-shadow:0 18px 40px rgba(0,0,0,.1); }
    .media-wrap { width:100%; max-height:320px; background:#eee; overflow:hidden; }
    .media-wrap img, .media-wrap video {
      width:100%; height:100%; object-fit:cover; display:block;
    }
    .card-body { padding:24px; }
    .card-body h2 { font-size:22px; color:#0B7A41; margin-bottom:10px; line-height:1.3; }
    .meta { font-size:13px; color:#888; margin-bottom:14px; }
    .description {
      color:#444; line-height:1.65; white-space:pre-wrap;
      display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
    }
    .description.expanded { -webkit-line-clamp:unset; }
    .read-more {
      display:inline-block; margin-top:12px; color:#0B7A41;
      font-weight:600; font-size:14px; cursor:pointer; border:none; background:none;
    }
    .empty, .loading {
      text-align:center; padding:60px 20px; color:#666;
    }
    .loading i { font-size:28px; color:#0B7A41; margin-bottom:12px; }
    footer { text-align:center; margin-top:50px; color:#888; font-size:14px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-newspaper"></i> News & Updates</h1>
      <p>Latest news, events and announcements from Brendava Tours</p>
    </header>

    <div id="newsContainer" class="news-grid">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i><br>
        Loading news...
      </div>
    </div>

    <footer>
      © Brendava Tours & Travel
    </footer>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAkUO02xkxGUUvgt2-C2UNRB_K6v3pBgiQ",
      authDomain: "brendava-tours-and-travel.firebaseapp.com",
      projectId: "brendava-tours-and-travel",
      storageBucket: "brendava-tours-and-travel.firebasestorage.app",
      messagingSenderId: "732703885570",
      appId: "1:732703885570:web:3011a3989d5fe36eb69a1b",
      measurementId: "G-ZC356HMW9C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const container = document.getElementById("newsContainer");

    // Load only published news, newest first
    db.collection("news")
      .where("published", "==", true)
      .orderBy("createdAt", "desc")
      .onSnapshot(snapshot => {
        if (snapshot.empty) {
          container.innerHTML = `
            <div class="empty">
              <i class="fas fa-inbox" style="font-size:40px;color:#ccc;margin-bottom:15px;"></i><br>
              No news published yet. Check back soon!
            </div>`;
          return;
        }

        container.innerHTML = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const date = new Date(data.createdAt).toLocaleDateString("en-US", {
            year: "numeric", month: "long", day: "numeric"
          });

          const card = document.createElement("article");
          card.className = "news-card";

          let mediaHtml = "";
          if (data.mediaUrl) {
            if (data.isVideo) {
              mediaHtml = `
                <div class="media-wrap">
                  <video src="${data.mediaUrl}" controls muted playsinline></video>
                </div>`;
            } else {
              mediaHtml = `
                <div class="media-wrap">
                  <img src="${data.mediaUrl}" alt="${data.title}" loading="lazy">
                </div>`;
            }
          }

          card.innerHTML = `
            ${mediaHtml}
            <div class="card-body">
              <h2>${escapeHtml(data.title)}</h2>
              <div class="meta"><i class="far fa-calendar-alt"></i> ${date}</div>
              <div class="description" id="desc-${doc.id}">${escapeHtml(data.description)}</div>
              <button class="read-more" onclick="toggleReadMore('${doc.id}')">Read more</button>
            </div>
          `;
          container.appendChild(card);
        });
      }, err => {
        console.error(err);
        container.innerHTML = `<div class="empty">Unable to load news. Please try again later.</div>`;
      });

    function toggleReadMore(id) {
      const el = document.getElementById(`desc-${id}`);
      const btn = el.nextElementSibling;
      if (el.classList.contains("expanded")) {
        el.classList.remove("expanded");
        btn.textContent = "Read more";
      } else {
        el.classList.add("expanded");
        btn.textContent = "Show less";
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
