<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Updates | Brendava Tours</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background:#f4f7f5; color:#222; min-height:100vh; }

    .header {
      background: linear-gradient(135deg, #0B7A41, #086033);
      color: white;
      padding: 28px 20px;
      text-align: center;
      position: relative;
    }
    .header h1 { font-size: 28px; margin-bottom: 6px; }
    .header p { opacity: 0.9; font-size: 15px; }
    .admin-toggle {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.25s;
    }
    .admin-toggle:hover { background: rgba(255,255,255,0.3); }

    .container {
      max-width: 860px;
      margin: 35px auto;
      padding: 0 20px 70px;
    }

    .loading, .empty {
      text-align: center;
      padding: 70px 20px;
      color: #666;
      font-size: 16px;
    }
    .loading i { font-size: 34px; color: #0B7A41; margin-bottom: 14px; display: block; }

    .news-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.07);
      margin-bottom: 28px;
      transition: transform 0.25s;
    }
    .news-card:hover { transform: translateY(-3px); }

    .news-media {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
      background: #eee;
    }
    video.news-media {
      max-height: 420px;
      background: #000;
    }

    .news-content { padding: 26px 28px; }
    .news-date {
      font-size: 13px;
      color: #0B7A41;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .news-title {
      font-size: 22px;
      color: #222;
      margin-bottom: 12px;
      line-height: 1.35;
    }
    .news-description {
      font-size: 15px;
      color: #444;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .hidden { display: none !important; }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 22px; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
      font-size: 14px;
      color: #333;
    }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      font-family: inherit;
      transition: 0.25s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #0B7A41;
      box-shadow: 0 0 0 3px rgba(11,122,65,0.12);
    }
    textarea { min-height: 130px; resize: vertical; line-height: 1.5; }

    .upload-box {
      border: 2px dashed #0B7A41;
      border-radius: 12px;
      padding: 28px 18px;
      text-align: center;
      cursor: pointer;
      background: #f8fdf9;
      transition: 0.3s;
    }
    .upload-box:hover { background: #eef8f1; }
    .upload-box i { font-size: 32px; color: #0B7A41; margin-bottom: 10px; display: block; }
    .upload-box p { color: #555; font-size: 14px; }
    .upload-box small { color: #888; font-size: 12px; }

    .preview { margin-top: 16px; display: none; text-align: center; }
    .preview img, .preview video {
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #0B7A41, #086033);
      color: #fff;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 6px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(11,122,65,0.28); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .logout-btn {
      background: #c0392b;
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .message {
      margin-top: 16px;
      padding: 13px;
      border-radius: 9px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .message.success { background: #e6f7ed; color: #0B7A41; display: block; }
    .message.error { background: #fde8e8; color: #c0392b; display: block; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .hint { font-size: 12.5px; color: #777; margin-top: 5px; }

    .section-title {
      font-size: 20px;
      color: #0B7A41;
      margin-bottom: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fas fa-newspaper"></i> News & Updates</h1>
    <p>Latest news from Brendava Tours</p>
    <button class="admin-toggle" id="adminToggleBtn">
      <i class="fas fa-lock"></i> Admin
    </button>
  </div>

  <div class="container">

    <!-- PUBLIC NEWS (always visible to everyone) -->
    <div id="publicSection">
      <div id="newsList">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i>
          Loading latest news...
        </div>
      </div>
    </div>

    <!-- ADMIN LOGIN (password only) -->
    <div id="loginSection" class="hidden">
      <div class="card" style="max-width:420px; margin:0 auto;">
        <h2 class="section-title">Admin Login</h2>
        <p style="color:#666; margin-bottom:22px; font-size:14px;">Enter the admin password to upload news</p>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPassword" placeholder="Enter password" autocomplete="current-password">
        </div>
        <button class="btn" id="loginBtn"><i class="fas fa-lock"></i> Login</button>
        <div class="message" id="loginMessage"></div>
        <button class="btn" id="backToNewsBtn" style="background:#555; margin-top:12px;">
          <i class="fas fa-arrow-left"></i> Back to News
        </button>
      </div>
    </div>

    <!-- ADMIN UPLOAD PANEL -->
    <div id="adminSection" class="hidden">
      <div class="top-bar">
        <h2 class="section-title" style="margin:0;">Upload News</h2>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>

      <div class="card">
        <form id="newsForm">
          <div class="form-group">
            <label>News Title *</label>
            <input type="text" id="newsTitle" required placeholder="e.g. Turker Marathon 2026 – Registration Open">
          </div>

          <div class="form-group">
            <label>Description / Full Article *</label>
            <textarea id="newsDescription" required placeholder="Write the full news content..."></textarea>
            <p class="hint">This text will be shown to all visitors.</p>
          </div>

          <div class="form-group">
            <label>Photo or Video (optional)</label>
            <div class="upload-box" id="mediaUploadArea">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>Click to upload a photo or video</p>
              <small>JPG, PNG, MP4 • Max 50 MB</small>
              <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;">
            </div>
            <div class="preview" id="mediaPreview"></div>
          </div>

          <div class="form-group">
            <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
              <input type="checkbox" id="publishNow" checked style="width:17px; height:17px;">
              Publish immediately (visible to all users)
            </label>
          </div>

          <button type="submit" class="btn" id="submitNewsBtn">
            <i class="fas fa-paper-plane"></i> Publish News
          </button>
          <div class="message" id="newsMessage"></div>
        </form>
      </div>

      <button class="btn" id="viewNewsBtn" style="background:#555; margin-top:10px;">
        <i class="fas fa-eye"></i> View Public News
      </button>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>

    // =====================================================
    // CONFIGURATION
    // =====================================================

    const CLOUD_NAME = "ziudh5iv";

    const UPLOAD_PRESET = "brendava_gallery";


    const firebaseConfig = {

      apiKey: "AIzaSyAkU02l2kxGUUvgt2-C2UNRB_K6v3pBgiQ",

      authDomain:
        "brendava-tours-and-travel.firebaseapp.com",

      projectId:
        "brendava-tours-and-travel",

      storageBucket:
        "brendava-tours-and-travel.firebasestorage.app",

      messagingSenderId:
        "732703885570",

      appId:
        "1:732703885570:web:3011a3989d5fe36eb69a1b",

      measurementId:
        "G-ZC356HMW9C"

    };


    // =====================================================
    // FIREBASE INITIALIZATION
    // =====================================================

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const db = firebase.firestore();


    // =====================================================
    // ELEMENTS
    // =====================================================

    const publicSection =
      document.getElementById("publicSection");

    const loginSection =
      document.getElementById("loginSection");

    const adminSection =
      document.getElementById("adminSection");

    const newsList =
      document.getElementById("newsList");

    const adminToggleBtn =
      document.getElementById("adminToggleBtn");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const backToNewsBtn =
      document.getElementById("backToNewsBtn");

    const viewNewsBtn =
      document.getElementById("viewNewsBtn");

    const loginMessage =
      document.getElementById("loginMessage");

    const newsForm =
      document.getElementById("newsForm");

    const mediaInput =
      document.getElementById("mediaInput");

    const mediaUploadArea =
      document.getElementById("mediaUploadArea");

    const mediaPreview =
      document.getElementById("mediaPreview");

    const submitNewsBtn =
      document.getElementById("submitNewsBtn");

    const newsMessage =
      document.getElementById("newsMessage");

    const adminUserInfo =
      document.getElementById("adminUserInfo");


    // =====================================================
    // VIEW SWITCHING
    // =====================================================

    function showPublic() {

      publicSection.classList.remove("hidden");

      loginSection.classList.add("hidden");

      adminSection.classList.add("hidden");

      loadNews();

    }


    function showLogin() {

      publicSection.classList.add("hidden");

      loginSection.classList.remove("hidden");

      adminSection.classList.add("hidden");

    }


    function showAdmin() {

      publicSection.classList.add("hidden");

      loginSection.classList.add("hidden");

      adminSection.classList.remove("hidden");

      updateAdminInfo();

    }


    adminToggleBtn.addEventListener(
      "click",
      showLogin
    );


    backToNewsBtn.addEventListener(
      "click",
      showPublic
    );


    viewNewsBtn.addEventListener(
      "click",
      showPublic
    );


    // =====================================================
    // CHECK ADMIN CLAIM
    // =====================================================

    async function checkAdmin() {

      const user = auth.currentUser;

      if (!user) {
        return false;
      }


      try {

        /*
         * Force-refresh the Firebase ID token.
         *
         * This is important after assigning the custom
         * admin claim.
         */

        const tokenResult =
          await user.getIdTokenResult(true);


        console.log(
          "Firebase custom claims:",
          tokenResult.claims
        );


        return tokenResult.claims.admin === true;

      } catch (error) {

        console.error(
          "Could not check admin claim:",
          error
        );

        return false;

      }

    }


    // =====================================================
    // ADMIN INFORMATION
    // =====================================================

    async function updateAdminInfo() {

      const user = auth.currentUser;

      if (!user) {

        adminUserInfo.innerHTML =
          "Not signed in.";

        return;

      }


      const isAdmin =
        await checkAdmin();


      if (isAdmin) {

        adminUserInfo.innerHTML = `
          <i class="fas fa-check-circle"
             style="color:#0B7A41;"></i>

          Signed in as:
          <strong>${escapeHtml(user.email || "")}</strong>

          <span class="status-badge published-badge">
            ADMIN
          </span>
        `;

      } else {

        adminUserInfo.innerHTML = `
          <i class="fas fa-exclamation-triangle"
             style="color:#c0392b;"></i>

          Account:
          <strong>${escapeHtml(user.email || "")}</strong>

          <span class="status-badge draft-badge">
            NOT ADMIN
          </span>
        `;

      }

    }


    // =====================================================
    // LOGIN
    // =====================================================

    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          document
            .getElementById("adminEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("adminPassword")
            .value;


        if (!email || !password) {

          showMsg(
            loginMessage,
            "Please enter your email and password.",
            "error"
          );

          return;

        }


        loginBtn.disabled = true;

        loginBtn.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> Signing in...';


        try {

          /*
           * Authenticate through Firebase.
           */

          const credential =
            await auth.signInWithEmailAndPassword(
              email,
              password
            );


          /*
           * Force refresh so we get the newest
           * custom claims.
           */

          const tokenResult =
            await credential.user.getIdTokenResult(true);


          console.log(
            "Login claims:",
            tokenResult.claims
          );


          /*
           * SECURITY CHECK
           */

          if (tokenResult.claims.admin !== true) {

            await auth.signOut();

            throw new Error(
              "This account is authenticated but does not have administrator permission."
            );

          }


          showMsg(
            loginMessage,
            "Login successful.",
            "success"
          );


          setTimeout(() => {

            showAdmin();

          }, 400);


        } catch (error) {

          console.error(
            "Admin login error:",
            error
          );


          let message =
            "Login failed. Please check your email and password.";


          if (
            error.code ===
            "auth/user-not-found"
          ) {

            message =
              "No Firebase Authentication account exists with this email.";

          } else if (
            error.code ===
            "auth/wrong-password"
          ) {

            message =
              "Incorrect password.";

          } else if (
            error.code ===
            "auth/invalid-credential"
          ) {

            message =
              "Invalid email or password.";

          } else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            message =
              "Too many failed attempts. Please try again later.";

          } else if (error.message) {

            message =
              error.message;

          }


          showMsg(
            loginMessage,
            message,
            "error"
          );

        } finally {

          loginBtn.disabled = false;

          loginBtn.innerHTML =
            '<i class="fas fa-sign-in-alt"></i> Sign In';

        }

      }
    );


    // =====================================================
    // ENTER KEY LOGIN
    // =====================================================

    document
      .getElementById("adminPassword")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            loginBtn.click();

          }

        }
      );


    // =====================================================
    // LOGOUT
    // =====================================================

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await auth.signOut();

          document
            .getElementById("adminEmail")
            .value = "";

          document
            .getElementById("adminPassword")
            .value = "";

          showPublic();

        } catch (error) {

          console.error(
            "Logout error:",
            error
          );

        }

      }
    );


    // =====================================================
    // MEDIA PREVIEW
    // =====================================================

    mediaUploadArea.addEventListener(
      "click",
      () => mediaInput.click()
    );


    mediaInput.addEventListener(
      "change",
      function() {

        const file =
          this.files[0];


        if (!file) {

          mediaPreview.style.display =
            "none";

          return;

        }


        /*
         * Maximum file size:
         * 50 MB
         */

        if (
          file.size >
          50 * 1024 * 1024
        ) {

          showMsg(
            newsMessage,
            "File too large. Maximum size is 50 MB.",
            "error"
          );

          this.value = "";

          mediaPreview.style.display =
            "none";

          return;

        }


        const isVideo =
          file.type.startsWith("video/");


        const url =
          URL.createObjectURL(file);


        mediaPreview.innerHTML = "";


        if (isVideo) {

          const video =
            document.createElement("video");

          video.src = url;

          video.controls = true;

          video.muted = true;

          video.playsInline = true;

          mediaPreview.appendChild(video);

        } else {

          const img =
            document.createElement("img");

          img.src = url;

          img.alt = "Media preview";

          mediaPreview.appendChild(img);

        }


        mediaPreview.style.display =
          "block";

      }
    );


    // =====================================================
    // CLOUDINARY UPLOAD
    // =====================================================

    async function uploadMedia(file) {

      if (!file) {

        return {
          url: "",
          isVideo: false
        };

      }


      const isVideo =
        file.type.startsWith("video/");


      const formData =
        new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "upload_preset",
        UPLOAD_PRESET
      );


      formData.append(
        "tags",
        "brendava_news"
      );


      const endpoint =
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${isVideo ? "video" : "image"}/upload`;


      const response =
        await fetch(
          endpoint,
          {
            method: "POST",
            body: formData
          }
        );


      let data = null;


      try {

        data =
          await response.json();

      } catch (error) {

        throw new Error(
          "Cloudinary returned an invalid response."
        );

      }


      if (!response.ok) {

        console.error(
          "Cloudinary error:",
          data
        );


        throw new Error(
          data?.error?.message ||
          "Cloudinary upload failed."
        );

      }


      if (!data.secure_url) {

        throw new Error(
          "Cloudinary did not return a media URL."
        );

      }


      return {

        url: data.secure_url,

        isVideo: isVideo

      };

    }


    // =====================================================
    // SUBMIT NEWS
    // =====================================================

    newsForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        /*
         * Make absolutely sure the user is
         * still authenticated.
         */

        const user =
          auth.currentUser;


        if (!user) {

          showMsg(
            newsMessage,
            "Your admin session has expired. Please sign in again.",
            "error"
          );

          showLogin();

          return;

        }


        /*
         * Verify admin custom claim before
         * attempting Firestore write.
         */

        const admin =
          await checkAdmin();


        if (!admin) {

          showMsg(
            newsMessage,
            "You are signed in, but your account is not authorized as an administrator.",
            "error"
          );

          return;

        }


        const title =
          document
            .getElementById("newsTitle")
            .value
            .trim();


        const description =
          document
            .getElementById("newsDescription")
            .value
            .trim();


        const file =
          mediaInput.files[0];


        const published =
          document
            .getElementById("publishNow")
            .checked;


        if (!title) {

          showMsg(
            newsMessage,
            "Please enter a news title.",
            "error"
          );

          return;

        }


        if (!description) {

          showMsg(
            newsMessage,
            "Please enter the news description.",
            "error"
          );

          return;

        }


        /*
         * Validate file size again.
         */

        if (
          file &&
          file.size >
          50 * 1024 * 1024
        ) {

          showMsg(
            newsMessage,
            "The selected file is larger than 50 MB.",
            "error"
          );

          return;

        }


        submitNewsBtn.disabled =
          true;


        submitNewsBtn.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> Publishing...';


        newsMessage.style.display =
          "none";


        try {

          let mediaUrl = "";

          let isVideo = false;


          // ---------------------------------------------
          // Upload media if selected
          // ---------------------------------------------

          if (file) {

            showMsg(
              newsMessage,
              "Uploading media...",
              "info"
            );


            const result =
              await uploadMedia(file);


            mediaUrl =
              result.url;


            isVideo =
              result.isVideo;

          }


          // ---------------------------------------------
          // Create Firestore document
          // ---------------------------------------------

          showMsg(
            newsMessage,
            "Saving news article...",
            "info"
          );


          await db
            .collection("news")
            .add({

              title: title,

              description: description,

              mediaUrl: mediaUrl,

              isVideo: isVideo,

              published: published,

              createdAt:
                firebase.firestore.FieldValue.serverTimestamp(),

              createdBy:
                user.uid,

              createdByEmail:
                user.email || ""

            });


          showMsg(
            newsMessage,
            published
              ? "News published successfully!"
              : "News saved as a draft.",
            "success"
          );


          // ---------------------------------------------
          // Reset form
          // ---------------------------------------------

          newsForm.reset();


          document
            .getElementById("publishNow")
            .checked = true;


          mediaPreview.innerHTML =
            "";

          mediaPreview.style.display =
            "none";


          mediaInput.value =
            "";


        } catch (error) {

          console.error(
            "Publish error:",
            error
          );


          let message =
            "Failed to publish the news.";


          if (
            error.code ===
            "permission-denied"
          ) {

            message =
              "Firestore denied the write. Make sure this Firebase account has the admin custom claim.";

          } else if (
            error.message
          ) {

            message =
              error.message;

          }


          showMsg(
            newsMessage,
            message,
            "error"
          );

        } finally {

          submitNewsBtn.disabled =
            false;


          submitNewsBtn.innerHTML =
            '<i class="fas fa-paper-plane"></i> Publish News';

        }

      }
    );


    // =====================================================
    // LOAD PUBLIC NEWS
    // =====================================================

    async function loadNews() {

      newsList.innerHTML = `

        <div class="loading">

          <i class="fas fa-spinner fa-spin"></i>

          Loading latest news...

        </div>

      `;


      try {

        /*
         * We use a simple query that matches the
         * Firestore public-read rule.
         */

        const snapshot =
          await db
            .collection("news")
            .where(
              "published",
              "==",
              true
            )
            .orderBy(
              "createdAt",
              "desc"
            )
            .get();


        if (snapshot.empty) {

          newsList.innerHTML = `

            <div class="empty">

              <i
                class="fas fa-inbox"
                style="
                  font-size:38px;
                  color:#ccc;
                  margin-bottom:12px;
                  display:block;
                "
              ></i>

              No news published yet.
              Check back soon!

            </div>

          `;

          return;

        }


        let html = "";


        snapshot.forEach(
          (doc) => {

            const data =
              doc.data();


            /*
             * Firestore Timestamp handling.
             */

            let dateText =
              "Recently";


            if (
              data.createdAt &&
              typeof data.createdAt.toDate ===
              "function"
            ) {

              dateText =
                data.createdAt
                  .toDate()
                  .toLocaleDateString(
                    "en-US",
                    {
                      year: "numeric",
                      month: "long",
                      day: "numeric"
                    }
                  );

            }


            let mediaHtml =
              "";


            if (data.mediaUrl) {

              if (data.isVideo) {

                mediaHtml = `

                  <video
                    class="news-media"
                    controls
                    playsinline
                    preload="metadata"
                  >

                    <source
                      src="${escapeHtml(data.mediaUrl)}"
                    >

                    Your browser does not support
                    the video tag.

                  </video>

                `;

              } else {

                mediaHtml = `

                  <img
                    class="news-media"
                    src="${escapeHtml(data.mediaUrl)}"
                    alt="${escapeHtml(data.title)}"
                    loading="lazy"
                  >

                `;

              }

            }


            html += `

              <article class="news-card">

                ${mediaHtml}

                <div class="news-content">

                  <div class="news-date">

                    <i class="far fa-calendar-alt"></i>

                    ${escapeHtml(dateText)}

                  </div>


                  <h2 class="news-title">

                    ${escapeHtml(data.title)}

                  </h2>


                  <div class="news-description">

                    ${escapeHtml(data.description)}

                  </div>

                </div>

              </article>

            `;

          }
        );


        newsList.innerHTML =
          html;


      } catch (error) {

        console.error(
          "Error loading news:",
          error
        );


        /*
         * Firestore index error.
         */

        if (
          error.message &&
          error.message
            .toLowerCase()
            .includes("index")
        ) {

          newsList.innerHTML = `

            <div
              class="empty"
              style="color:#c0392b;"
            >

              <i
                class="fas fa-database"
                style="
                  font-size:34px;
                  margin-bottom:10px;
                  display:block;
                "
              ></i>

              <strong>
                Firestore index required.
              </strong>

              <br><br>

              Open the browser console
              and click the Firebase link
              to create the required index.

            </div>

          `;

          return;

        }


        /*
         * Permission error.
         */

        if (
          error.code ===
          "permission-denied"
        ) {

          newsList.innerHTML = `

            <div
              class="empty"
              style="color:#c0392b;"
            >

              <i
                class="fas fa-lock"
                style="
                  font-size:34px;
                  margin-bottom:10px;
                  display:block;
                "
              ></i>

              Firestore denied access
              to published news.

            </div>

          `;

          return;

        }


        newsList.innerHTML = `

          <div
            class="empty"
            style="color:#c0392b;"
          >

            <i
              class="fas fa-exclamation-triangle"
              style="
                font-size:34px;
                margin-bottom:10px;
                display:block;
              "
            ></i>

            Failed to load news.
            Please try again later.

          </div>

        `;

      }

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value) {

      if (value === null ||
          value === undefined) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // MESSAGE
    // =====================================================

    function showMsg(
      element,
      text,
      type
    ) {

      element.className =
        `message ${type}`;

      element.textContent =
        text;

    }


    // =====================================================
    // AUTH STATE
    // =====================================================

    auth.onAuthStateChanged(
      async (user) => {

        if (!user) {

          /*
           * Always show public news to
           * logged-out visitors.
           */

          if (
            !adminSection.classList.contains(
              "hidden"
            )
          ) {

            showPublic();

          }

          return;

        }


        /*
         * We don't automatically show the
         * admin panel just because somebody
         * is authenticated.
         *
         * They must have admin:true.
         */

        try {

          const isAdmin =
            await checkAdmin();


          if (isAdmin) {

            console.log(
              "Authenticated admin:",
              user.email
            );

          } else {

            console.log(
              "Authenticated user is not an admin:",
              user.email
            );

          }

        } catch (error) {

          console.error(
            "Auth state check failed:",
            error
          );

        }

      }
    );


    // =====================================================
    // START PUBLIC PAGE
    // =====================================================

    showPublic();

  </script>

</body>
</html>
