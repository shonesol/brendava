<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Updates | Brendava Tours</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background:#f4f7f5; color:#222; min-height:100vh; }

    .header {
      background: linear-gradient(135deg, #0B7A41, #086033);
      color: white;
      padding: 28px 20px;
      text-align: center;
      position: relative;
    }
    .header h1 { font-size: 28px; margin-bottom: 6px; }
    .header p { opacity: 0.9; font-size: 15px; }
    .admin-toggle {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.25s;
    }
    .admin-toggle:hover { background: rgba(255,255,255,0.3); }

    .container {
      max-width: 860px;
      margin: 35px auto;
      padding: 0 20px 70px;
    }

    .loading, .empty {
      text-align: center;
      padding: 70px 20px;
      color: #666;
      font-size: 16px;
    }
    .loading i { font-size: 34px; color: #0B7A41; margin-bottom: 14px; display: block; }

    .news-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.07);
      margin-bottom: 28px;
      transition: transform 0.25s;
    }
    .news-card:hover { transform: translateY(-3px); }

    .news-media {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
      background: #eee;
    }
    video.news-media {
      max-height: 420px;
      background: #000;
    }

    .news-content { padding: 26px 28px; }
    .news-date {
      font-size: 13px;
      color: #0B7A41;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .news-title {
      font-size: 22px;
      color: #222;
      margin-bottom: 12px;
      line-height: 1.35;
    }
    .news-description {
      font-size: 15px;
      color: #444;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .hidden { display: none !important; }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 22px; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
      font-size: 14px;
      color: #333;
    }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      font-family: inherit;
      transition: 0.25s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #0B7A41;
      box-shadow: 0 0 0 3px rgba(11,122,65,0.12);
    }
    textarea { min-height: 130px; resize: vertical; line-height: 1.5; }

    .upload-box {
      border: 2px dashed #0B7A41;
      border-radius: 12px;
      padding: 28px 18px;
      text-align: center;
      cursor: pointer;
      background: #f8fdf9;
      transition: 0.3s;
    }
    .upload-box:hover { background: #eef8f1; }
    .upload-box i { font-size: 32px; color: #0B7A41; margin-bottom: 10px; display: block; }
    .upload-box p { color: #555; font-size: 14px; }
    .upload-box small { color: #888; font-size: 12px; }

    .preview { margin-top: 16px; display: none; text-align: center; }
    .preview img, .preview video {
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #0B7A41, #086033);
      color: #fff;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 6px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(11,122,65,0.28); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .logout-btn {
      background: #c0392b;
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .message {
      margin-top: 16px;
      padding: 13px;
      border-radius: 9px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .message.success { background: #e6f7ed; color: #0B7A41; display: block; }
    .message.error { background: #fde8e8; color: #c0392b; display: block; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .hint { font-size: 12.5px; color: #777; margin-top: 5px; }

    .section-title {
      font-size: 20px;
      color: #0B7A41;
      margin-bottom: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fas fa-newspaper"></i> News & Updates</h1>
    <p>Latest news from Brendava Tours</p>
    <button class="admin-toggle" id="adminToggleBtn">
      <i class="fas fa-lock"></i> Admin
    </button>
  </div>

  <div class="container">

    <!-- PUBLIC NEWS (always visible to everyone) -->
    <div id="publicSection">
      <div id="newsList">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i>
          Loading latest news...
        </div>
      </div>
    </div>

    <!-- ADMIN LOGIN (password only) -->
    <div id="loginSection" class="hidden">
      <div class="card" style="max-width:420px; margin:0 auto;">
        <h2 class="section-title">Admin Login</h2>
        <p style="color:#666; margin-bottom:22px; font-size:14px;">Enter the admin password to upload news</p>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPassword" placeholder="Enter password" autocomplete="current-password">
        </div>
        <button class="btn" id="loginBtn"><i class="fas fa-lock"></i> Login</button>
        <div class="message" id="loginMessage"></div>
        <button class="btn" id="backToNewsBtn" style="background:#555; margin-top:12px;">
          <i class="fas fa-arrow-left"></i> Back to News
        </button>
      </div>
    </div>

    <!-- ADMIN UPLOAD PANEL -->
    <div id="adminSection" class="hidden">
      <div class="top-bar">
        <h2 class="section-title" style="margin:0;">Upload News</h2>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>

      <div class="card">
        <form id="newsForm">
          <div class="form-group">
            <label>News Title *</label>
            <input type="text" id="newsTitle" required placeholder="e.g. Turker Marathon 2026 – Registration Open">
          </div>

          <div class="form-group">
            <label>Description / Full Article *</label>
            <textarea id="newsDescription" required placeholder="Write the full news content..."></textarea>
            <p class="hint">This text will be shown to all visitors.</p>
          </div>

          <div class="form-group">
            <label>Photo or Video (optional)</label>
            <div class="upload-box" id="mediaUploadArea">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>Click to upload a photo or video</p>
              <small>JPG, PNG, MP4 • Max 50 MB</small>
              <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;">
            </div>
            <div class="preview" id="mediaPreview"></div>
          </div>

          <div class="form-group">
            <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
              <input type="checkbox" id="publishNow" checked style="width:17px; height:17px;">
              Publish immediately (visible to all users)
            </label>
          </div>

          <button type="submit" class="btn" id="submitNewsBtn">
            <i class="fas fa-paper-plane"></i> Publish News
          </button>
          <div class="message" id="newsMessage"></div>
        </form>
      </div>

      <button class="btn" id="viewNewsBtn" style="background:#555; margin-top:10px;">
        <i class="fas fa-eye"></i> View Public News
      </button>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // ====================== CONFIG ======================
    const CLOUD_NAME    = "ziudh5iv";
    const UPLOAD_PRESET = "brendava_gallery";

    // Simple password for the admin panel UI
    const ADMIN_PASSWORD = "namarisha";

    // Change this to the real email of an existing Firebase Auth user
    // whose password is also "namarisha"
    const ADMIN_EMAIL = "admin@brendava.com";

    const firebaseConfig = {
      apiKey: "AIzaSyAkUO02xkxGUUvgt2-C2UNRB_K6v3pBgiQ",
      authDomain: "brendava-tours-and-travel.firebaseapp.com",
      projectId: "brendava-tours-and-travel",
      storageBucket: "brendava-tours-and-travel.firebasestorage.app",
      messagingSenderId: "732703885570",
      appId: "1:732703885570:web:3011a3989d5fe36eb69a1b",
      measurementId: "G-ZC356HMW9C"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    // ====================== ELEMENTS ======================
    const publicSection   = document.getElementById("publicSection");
    const loginSection    = document.getElementById("loginSection");
    const adminSection    = document.getElementById("adminSection");
    const newsList        = document.getElementById("newsList");

    const adminToggleBtn  = document.getElementById("adminToggleBtn");
    const loginBtn        = document.getElementById("loginBtn");
    const logoutBtn       = document.getElementById("logoutBtn");
    const backToNewsBtn   = document.getElementById("backToNewsBtn");
    const viewNewsBtn     = document.getElementById("viewNewsBtn");
    const loginMessage    = document.getElementById("loginMessage");
    const newsForm        = document.getElementById("newsForm");
    const mediaInput      = document.getElementById("mediaInput");
    const mediaUploadArea = document.getElementById("mediaUploadArea");
    const mediaPreview    = document.getElementById("mediaPreview");
    const submitNewsBtn   = document.getElementById("submitNewsBtn");
    const newsMessage     = document.getElementById("newsMessage");

    // ====================== VIEW SWITCHING ======================
    function showPublic() {
      publicSection.classList.remove("hidden");
      loginSection.classList.add("hidden");
      adminSection.classList.add("hidden");
      loadNews();
    }

    function showLogin() {
      publicSection.classList.add("hidden");
      loginSection.classList.remove("hidden");
      adminSection.classList.add("hidden");
    }

    function showAdmin() {
      publicSection.classList.add("hidden");
      loginSection.classList.add("hidden");
      adminSection.classList.remove("hidden");
    }

    adminToggleBtn.addEventListener("click", showLogin);
    backToNewsBtn.addEventListener("click", showPublic);
    viewNewsBtn.addEventListener("click", showPublic);

    // ====================== SIMPLE PASSWORD LOGIN ======================
    loginBtn.addEventListener("click", async () => {
      const password = document.getElementById("adminPassword").value;

      if (!password) {
        showMsg(loginMessage, "Please enter the password", "error");
        return;
      }

      if (password !== ADMIN_PASSWORD) {
        showMsg(loginMessage, "Incorrect password", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

      try {
        // Sign in with the real Firebase account so writes are allowed by security rules
        await auth.signInWithEmailAndPassword(ADMIN_EMAIL, ADMIN_PASSWORD);
        showMsg(loginMessage, "Login successful!", "success");
        showAdmin();
      } catch (err) {
        console.error(err);
        // Even if Firebase sign-in fails, still show the admin panel
        // (you can remove the try/catch if you want strict Firebase auth)
        showMsg(loginMessage, "Login successful (UI only)", "success");
        showAdmin();
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-lock"></i> Login';
      }
    });

    // ====================== LOGOUT ======================
    logoutBtn.addEventListener("click", async () => {
      try {
        await auth.signOut();
      } catch (e) {}
      document.getElementById("adminPassword").value = "";
      showPublic();
    });

    // ====================== MEDIA PREVIEW ======================
    mediaUploadArea.addEventListener("click", () => mediaInput.click());

    mediaInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      if (file.size > 50 * 1024 * 1024) {
        alert("File too large (max 50 MB)");
        this.value = "";
        return;
      }

      const isVideo = file.type.startsWith("video/");
      const url = URL.createObjectURL(file);

      mediaPreview.innerHTML = "";
      if (isVideo) {
        const v = document.createElement("video");
        v.src = url;
        v.controls = true;
        v.muted = true;
        v.style.maxWidth = "100%";
        v.style.maxHeight = "200px";
        v.style.borderRadius = "10px";
        mediaPreview.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.src = url;
        mediaPreview.appendChild(img);
      }
      mediaPreview.style.display = "block";
    });

    // ====================== UPLOAD TO CLOUDINARY ======================
    async function uploadMedia(file) {
      const isVideo = file.type.startsWith("video/");
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("tags", "brendava_news");

      const endpoint = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${isVideo ? "video" : "image"}/upload`;

      const res = await fetch(endpoint, {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      if (!res.ok) {
        console.error("Cloudinary error:", data);
        throw new Error(data.error?.message || "Cloudinary upload failed");
      }

      return { url: data.secure_url, isVideo };
    }

    // ====================== SUBMIT NEWS ======================
    newsForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title       = document.getElementById("newsTitle").value.trim();
      const description = document.getElementById("newsDescription").value.trim();
      const file        = mediaInput.files[0];
      const published   = document.getElementById("publishNow").checked;

      if (!title || !description) {
        showMsg(newsMessage, "Title and description are required", "error");
        return;
      }

      submitNewsBtn.disabled = true;
      submitNewsBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading & Publishing...';
      newsMessage.style.display = "none";

      try {
        let mediaUrl = "";
        let isVideo  = false;

        if (file) {
          const result = await uploadMedia(file);
          mediaUrl = result.url;
          isVideo  = result.isVideo;
        }

        await db.collection("news").add({
          title,
          description,
          mediaUrl,
          isVideo,
          published,
          createdAt: Date.now(),
          createdBy: auth.currentUser ? auth.currentUser.email : "admin"
        });

        showMsg(newsMessage, "News published successfully!", "success");

        newsForm.reset();
        mediaPreview.style.display = "none";
        mediaPreview.innerHTML = "";
        mediaInput.value = "";

      } catch (err) {
        console.error("Publish error:", err);
        showMsg(newsMessage, err.message || "Failed to publish. Make sure you are properly authenticated.", "error");
      } finally {
        submitNewsBtn.disabled = false;
        submitNewsBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Publish News';
      }
    });

    // ====================== LOAD PUBLIC NEWS (works without login) ======================
    async function loadNews() {
      newsList.innerHTML = `
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i>
          Loading latest news...
        </div>`;

      try {
        // This query only returns published news → matches your security rules
        const snapshot = await db.collection("news")
          .where("published", "==", true)
          .orderBy("createdAt", "desc")
          .get();

        if (snapshot.empty) {
          newsList.innerHTML = `
            <div class="empty">
              <i class="fas fa-inbox" style="font-size:38px;color:#ccc;margin-bottom:12px;display:block;"></i>
              No news published yet. Check back soon!
            </div>`;
          return;
        }

        let html = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const date = new Date(data.createdAt).toLocaleDateString("en-US", {
            year: "numeric", month: "long", day: "numeric"
          });

          let mediaHtml = "";
          if (data.mediaUrl) {
            if (data.isVideo) {
              mediaHtml = `
                <video class="news-media" controls playsinline preload="metadata">
                  <source src="${data.mediaUrl}" type="video/mp4">
                  Your browser does not support the video tag.
                </video>`;
            } else {
              mediaHtml = `<img class="news-media" src="${data.mediaUrl}" alt="${escapeHtml(data.title)}" loading="lazy">`;
            }
          }

          html += `
            <article class="news-card">
              ${mediaHtml}
              <div class="news-content">
                <div class="news-date"><i class="far fa-calendar-alt"></i> ${date}</div>
                <h2 class="news-title">${escapeHtml(data.title)}</h2>
                <div class="news-description">${escapeHtml(data.description)}</div>
              </div>
            </article>`;
        });

        newsList.innerHTML = html;

      } catch (err) {
        console.error("Error loading news:", err);

        // Helpful message if the composite index is missing
        if (err.message && err.message.includes("index")) {
          newsList.innerHTML = `
            <div class="empty" style="color:#c0392b;">
              <i class="fas fa-exclamation-triangle" style="font-size:34px;margin-bottom:10px;display:block;"></i>
              Missing Firestore index.<br>
              Open the browser console (F12) and click the link to create it.
            </div>`;
        } else {
          newsList.innerHTML = `
            <div class="empty" style="color:#c0392b;">
              <i class="fas fa-exclamation-triangle" style="font-size:34px;margin-bottom:10px;display:block;"></i>
              Failed to load news. Please try again later.
            </div>`;
        }
      }
    }

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showMsg(el, text, type) {
      el.className = `message ${type}`;
      el.textContent = text;
    }

    // Always start on the public news page
    showPublic();
  </script>
</body>
</html>
